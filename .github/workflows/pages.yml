name: Deploy exact portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact portfolio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          curl -fL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/ZubaerAhmed13/zubaer-ahmed-PDF-TEST/29d31c9b329f8fdaad325a26413b686c94076912/index.html" \
            -o /tmp/portfolio-v2.html
          echo "b031190711123d645fcb1d50ecffd98b8ab9109e720b2832dde3b677c954c4b2  /tmp/portfolio-v2.html" | sha256sum -c -
          base64 -d .portfolio_patch/portfolio_v2_to_v3.zst.b64 > /tmp/portfolio.patch.zst
          zstd -d --patch-from=/tmp/portfolio-v2.html /tmp/portfolio.patch.zst -q -o site/index.html
          echo "9e6df0d1cccfa38bd91d2d81746f07470ff90200f0b2e70e4995d688580a9f1b  site/index.html" | sha256sum -c -

      - name: Materialize verified index.html
        shell: bash
        run: |
          set -euo pipefail
          if [ -f index.html ] && cmp -s site/index.html index.html; then
            echo "index.html already matches the verified portfolio"
          else
            cp site/index.html index.html
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Materialize exact portfolio [skip ci]"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
